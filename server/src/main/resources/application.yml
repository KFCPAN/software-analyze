server:
  port: 8080

spring:
  application:
    name: lnf-server
  datasource:
    # stringtype=unspecified：兼容 jsonb 列（items.images）以字符串方式写入
    url: jdbc:postgresql://localhost:5432/lost_and_found?stringtype=unspecified
    username: lnf
    password: lnf2026
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置：secret 至少 256bit（HS256）。生产环境请通过环境变量覆盖。
jwt:
  secret: bG5mLXNlcnZlci1kZXYtc2VjcmV0LWtleS0yMDI2LWNhbXB1cy1sb3N0LWFuZC1mb3VuZC1wbGF0Zm9ybQ==
  # 过期时间：24 小时（毫秒）
  expire: 86400000

app:
  # 图片上传目录（相对应用工作目录），/files/** 映射到该目录
  upload-dir: uploads
  # AES 密钥（16/24/32 字节），用于隐藏特征答案加密。生产环境请通过环境变量覆盖。
  aes-key: LnfAesKey2026!!!

# 匹配引擎微服务（matcher/，FastAPI）
matcher:
  base-url: http://localhost:9000

# 智能匹配：综合分 = 0.6*文本 + 0.2*时间 + 0.2*地点，≥ 阈值才写入 matches
match:
  threshold: 0.55
  weights:
    text: 0.6
    time: 0.2
    location: 0.2

logging:
  level:
    com.lnf.server: debug
