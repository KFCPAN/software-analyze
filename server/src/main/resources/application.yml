server:
  port: 8080

spring:
  application:
    name: lnf-server
  datasource:
    # stringtype=unspecified：兼容 jsonb 列（items.images）以字符串方式写入
    url: jdbc:postgresql://localhost:5432/lost_and_found?stringtype=unspecified
    username: lnf
    password: lnf2026
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

# JWT 配置：secret 至少 256bit（HS256）。生产环境请通过环境变量覆盖。
jwt:
  secret: bG5mLXNlcnZlci1kZXYtc2VjcmV0LWtleS0yMDI2LWNhbXB1cy1sb3N0LWFuZC1mb3VuZC1wbGF0Zm9ybQ==
  # 过期时间：24 小时（毫秒）
  expire: 86400000

app:
  # 图片上传目录，/files/** 映射到该目录。
  # 用绝对路径：后端无论从哪个目录启动（IDEA 工作目录在仓库根、java -jar 在任意目录）都能正确找到图片，
  # 相对路径在启动目录不是 server/ 时会导致图片全部 500。
  upload-dir: C:/Users/heweiming/Desktop/软件实践/lost-and-found/server/uploads
  # AES 密钥（16/24/32 字节），用于隐藏特征答案加密。生产环境请通过环境变量覆盖。
  aes-key: LnfAesKey2026!!!

# 匹配引擎微服务（matcher/，FastAPI）
matcher:
  base-url: http://localhost:9000

# 智能匹配：先过语义硬门槛（text ≥ min-text-score，或图像分 ≥ strong-image-score 的强图像证据可豁免），
# 再过总分阈值（综合分 ≥ threshold 才写入 matches）。两套权重：
# 默认（双方均无图或仅单方有图）：0.7*文本 + 0.15*时间 + 0.15*地点
# 双方都有图像向量：0.5*文本 + 0.2*图像 + 0.15*时间 + 0.15*地点
# 迭代记录：① 时间+地点合计曾达 0.4，"同校区近期无关物品"压线误报（黑色钱包→足球）→ 加语义硬门槛；
#          ② 文本权重 0.6 时颜色/品类精确匹配的排名被时空因子反超（黑色钱包排在棕色钱包后）→ 文本提到 0.7；
#          ③ 空地点中立分 0.4 高于"已知跨校区"0.2，不填地点反而占便宜 → 降为 0.3。
# 阈值实验见 docs/research/匹配实验结果.md
match:
  threshold: 0.55
  min-text-score: 0.50
  strong-image-score: 0.85
  weights:
    text: 0.7
    time: 0.15
    location: 0.15
    with-image:
      text: 0.5
      image: 0.2
      time: 0.15
      location: 0.15

logging:
  level:
    com.lnf.server: debug
