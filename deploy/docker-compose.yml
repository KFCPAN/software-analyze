services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lnf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lnf
      POSTGRES_PASSWORD: lnf2026
      POSTGRES_DB: lost_and_found
    ports:
      - "5432:5432"
    volumes:
      - lnf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lnf -d lost_and_found"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lnf-pgdata:
